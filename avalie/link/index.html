<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Link de Avaliação | Autoescola Aline</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
    <link rel="manifest" href="../../assets/site.webmanifest">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.7s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center fade-in">

        <img src="../../assets/logo.png" alt="Autoescola Aline" class="w-40 mx-auto mb-6">

        <h1 class="text-xl font-bold text-gray-800 mb-6">Gerador de Link de Avaliação</h1>

        <div class="mb-6 text-left">
            <label class="block text-gray-700 font-bold mb-2 text-sm" for="clientName">Nome do Aluno</label>
            <input type="text" id="clientName"
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"
                placeholder="Ex: João da Silva">
        </div>

        <button id="generateBtn"
            class="w-full bg-[#1E6A9C] text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
            <i class="fas fa-link"></i> Gerar e Copiar Link
        </button>

        <!-- Área do Resultado -->
        <div id="resultArea" class="mt-6 hidden">
            <p class="text-sm text-gray-500 mb-2">Mensagem gerada:</p>
            <div class="bg-gray-50 p-3 rounded border border-gray-200 break-words text-sm text-gray-700 font-mono whitespace-pre-wrap text-left"
                id="generatedLink">
                <!-- Link aparecerá aqui -->
            </div>
            <p class="text-green-600 text-sm font-bold mt-2 animate-bounce">
                <i class="fas fa-check"></i> Copiado para a área de transferência!
            </p>
        </div>

    </div>

    <script>
        const input = document.getElementById('clientName');
        const btn = document.getElementById('generateBtn');
        const resultArea = document.getElementById('resultArea');
        const linkDisplay = document.getElementById('generatedLink');
        const baseUrl = "https://autoescolaaline.com.br/avalie";

        btn.addEventListener('click', () => {
            const name = input.value.trim();
            if (!name) {
                alert('Por favor, digite o nome do aluno.');
                return;
            }

            // Codifica o nome para URL (ex: João Silva -> Jo%C3%A3o%20Silva)
            const encodedName = encodeURIComponent(name);
            const fullUrl = `${baseUrl}?name=${encodedName}`;

            // Monta a mensagem para WhatsApp
            const message = `Olá! Tudo bem? 🚗💨\n\n` +
                `Parabéns pela sua conquista! 🏆\n` +
                `Poderia nos ajudar avaliando sua experiência com a gente? Leva menos de 1 minuto:\n` +
                `${fullUrl}\n\n` +
                `Obrigado! *Autoescola Aline*`;

            // Exibe
            linkDisplay.innerText = message;
            resultArea.classList.remove('hidden');

            // Copia para área de transferência
            navigator.clipboard.writeText(message).then(() => {
                // Feedback visual no botão
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                btn.classList.add('bg-green-600');

                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                alert('Erro ao copiar automaticamente. Por favor copie manualmente.');
            });
        });

        // Permitir Enter para enviar
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btn.click();
            }
        });
    </script>
</body>

</html>
