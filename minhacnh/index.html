<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINHA CNH - Acompanhamento do Processo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .text-logo-blue {
            color: #1E6A9C;
        }
        /* Vertical line for the timeline */
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 2rem;
            bottom: 2rem;
            width: 4px;
            background-color: #e5e7eb; /* gray-200 */
            transform: translateX(-50%);
        }
        /* Mobile timeline line */
        @media (max-width: 767px) {
            .timeline-line {
                left: 1.25rem; /* Corresponds to w-10 / 2 */
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body class="bg-white text-gray-800">

    <!-- Main App Container -->
    <div id="app-container" class="container mx-auto p-4 md:p-8 max-w-4xl">
        
        <!-- Login Banner (for logged-out users) -->
        <div id="login-banner" class="hidden bg-blue-50 border-t-4 border-logo-blue rounded-b text-blue-900 px-4 py-3 shadow-md mb-8" role="alert">
          <div class="flex flex-col sm:flex-row sm:items-center">
            <div class="flex items-center">
                <div class="py-1"><svg class="fill-current h-6 w-6 text-logo-blue mr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M10 20a10 10 0 1 1 0-20 10 10 0 0 1 0 20zm-1-9V7a1 1 0 0 1 2 0v4h.5a1 1 0 0 1 0 2H9a1 1 0 0 1-1-1zm1-4a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg></div>
                <div class="text-left">
                  <p class="font-bold">Salve seu progresso na nuvem!</p>
                  <p class="text-sm">Entre com sua conta para acessar de qualquer dispositivo.</p>
                </div>
            </div>
            <button id="login-btn" class="mt-3 sm:mt-0 sm:ml-auto flex-shrink-0 bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-300 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><path id="a" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></defs><clipPath id="b"><use xlink:href="#a" overflow="visible"/></clipPath><path clip-path="url(#b)" fill="#FBBC05" d="M0 37V11l17 13z"/><path clip-path="url(#b)" fill="#EA4335" d="M0 11l17 13 7-6.1L48 14V0H0z"/><path clip-path="url(#b)" fill="#34A853" d="M0 37l30-23 7.9 1L48 0v48H0z"/><path clip-path="url(#b)" fill="#4285F4" d="M48 48L17 24l-4-3 35-10z"/></svg>
                <span>Entrar com Google</span>
            </button>
          </div>
        </div>

        <!-- User Info (for logged-in users) -->
        <div id="user-info" class="hidden justify-end items-center mb-6"></div>


        <header class="text-center mb-12">
            <!-- Logo -->
            <div class="mb-4">
                <img src="../assets/minhacnh.jpg" alt="Logo MINHA CNH" class="w-24 h-24 rounded-full mx-auto object-cover shadow-md">
            </div>

            <h1 class="text-5xl md:text-7xl font-black uppercase text-gray-800">
                MINHA <span class="text-logo-blue">CNH</span>
            </h1>
            <p class="text-gray-600 mt-3">Acompanhe seu processo para tirar a habilitação, etapa por etapa!</p>
            <div class="mt-6 flex flex-col md:flex-row justify-center items-center gap-4">
                <div id="duration-counter" class="bg-blue-50 border border-logo-blue text-logo-blue font-bold text-lg py-3 px-6 rounded-lg shadow-md w-full md:w-auto"></div>
                <div id="total-cost-counter" class="bg-emerald-50 border border-emerald-500 text-emerald-800 font-bold text-lg py-3 px-6 rounded-lg shadow-md w-full md:w-auto"></div>
            </div>
        </header>

        <main id="timeline-container" class="relative pt-4">
            <div class="timeline-line hidden md:block"></div>
        </main>

        <footer class="text-center mt-12">
             <div class="flex flex-col md:flex-row justify-center items-center gap-4">
                <button id="share-btn" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" /></svg>
                    <span>Compartilhar</span>
                </button>
            </div>
            <p id="footer-save-info" class="text-xs text-gray-400 mt-4"></p>
        </footer>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-500 text-white py-2 px-4 rounded-lg shadow-xl transition-transform transform translate-x-full duration-500"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // ******************************************************
        // COLE SUAS CONFIGURAÇÕES DO FIREBASE AQUI
        // ******************************************************
        const firebaseConfig = {
            apiKey: "AIzaSyAu9mV6DtpClQnmkZFlSC8cr0HBtFgdmQY",
            authDomain: "minhacnhapp.firebaseapp.com",
            projectId: "minhacnhapp",
            storageBucket: "minhacnhapp.appspot.com",
            messagingSenderId: "828173291257",
            appId: "1:828173291257:web:ad6e49d67c6ae18f35dc28",
            measurementId: "G-4NRWDBZJZD"
        };
        // ******************************************************

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        document.addEventListener('DOMContentLoaded', () => {
            const loginBanner = document.getElementById('login-banner');
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const footerSaveInfo = document.getElementById('footer-save-info');
            
            const timelineContainer = document.getElementById('timeline-container');
            const shareBtn = document.getElementById('share-btn');
            const toast = document.getElementById('toast');
            const durationCounter = document.getElementById('duration-counter');
            const totalCostCounter = document.getElementById('total-cost-counter');

            let currentUser = null;
            let stagesData = [];
            let debounceTimer;

            const initialStages = [
                { id: 'requerimento', title: 'Formalização do Requerimento', status: 'pendente', date: '', notes: 'Início do processo no DETRAN ou canais digitais.', icon: 'M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9', cost: '' },
                { id: 'cursoTeorico', title: 'Curso Teórico', status: 'pendente', date: '', notes: 'Aulas sobre legislação, direção defensiva, etc.', icon: 'M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25', cost: '' },
                { id: 'biometria', title: 'Coleta Biométrica', status: 'pendente', date: '', notes: 'Coleta de foto, assinatura e digitais.', icon: 'M7.864 4.243A7.5 7.5 0 0119.5 10.5c0 2.92-.556 5.709-1.588 8.261a7.5 7.5 0 01-14.124 0c-1.032-2.552-1.588-5.34-1.588-8.261a7.5 7.5 0 013.75-6.486', cost: '' },
                { id: 'examesMedicos', title: 'Exames de Aptidão Física e Mental', status: 'pendente', date: '', notes: 'Avaliação médica e psicológica.', icon: 'M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z', cost: '' },
                { id: 'exameTeorico', title: 'Exame Teórico', status: 'pendente', date: '', notes: 'Prova oficial do DETRAN.', icon: 'M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z', cost: '' },
                { id: 'divulgacaoPasseDePrimeira', title: 'Dica de Ouro: Passe de Primeira!', notes: 'Aprovado na teoria? Turbine sua preparação para o exame prático! Nosso treinamento exclusivo "Passe de Primeira" tem tudo o que você precisa para conquistar sua CNH sem medo.', url: 'https://autoescolaaline.com.br/curso/', buttonText: 'Conhecer o Treinamento', icon: 'M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.311a12.061 12.061 0 01-4.5 0m3.75 2.311a12.061 12.061 0 01-4.5 0m5.625-10.44a6 6 0 11-11.25 0 6 6 0 0111.25 0z'},
                { id: 'aulasPraticas', title: 'Aulas Práticas de Direção', status: 'pendente', date: '', notes: 'Etapa opcional, mas recomendada. Defina a carga horária com seu instrutor.', icon: 'M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.472-.648a.75.75 0 01.819.162l3.908 3.908a.75.75 0 01-1.06 1.06l-3.908-3.908a8.973 8.973 0 01-4.286.974c-.487.023-.98.033-1.472.033a9.006 9.006 0 01-5.688-1.928A9 9 0 016 9a8.968 8.968 0 01.622-3.422A8.973 8.973 0 0112 3c1.242 0 2.417.316 3.472.867l-4.286 4.286a.75.75 0 01-1.06-1.06l3.908-3.908z', cost: '' },
                { id: 'examePratico', title: 'Exame de Direção Veicular', status: 'pendente', date: '', notes: 'Prova prática de baliza e percurso.', icon: 'M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9.75m18 0v-6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 1.5v6m12 15a3 3 0 11-6 0 3 3 0 016 0z', cost: '' },
                { id: 'permissao', title: 'Emissão da Permissão para Dirigir (PPD)', status: 'pendente', date: '', notes: 'Parabéns! Válida por 1 ano.', icon: 'M16.5 18a4.5 4.5 0 00-1.897 8.242l-2.276-2.275a2.25 2.25 0 01-.26-3.238l1.03-1.03a2.25 2.25 0 013.238.26l2.275 2.276A4.5 4.5 0 0016.5 18z', cost: '' },
                { id: 'cnhDefinitiva', title: 'CNH Definitiva', status: 'pendente', date: '', notes: 'Conquista final após 1 ano sem infrações graves/gravíssimas.', icon: 'M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z', cost: '' }
            ];

            // --- Authentication Logic ---
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    loginBanner.classList.add('hidden');
                    userInfo.classList.remove('hidden');
                    userInfo.classList.add('flex');
                    footerSaveInfo.textContent = "Seu progresso é salvo na nuvem, associado à sua conta.";
                    displayUserInfo(user);
                    await migrateLocalDataToFirestore();
                    await loadProgress();
                } else {
                    currentUser = null;
                    loginBanner.classList.remove('hidden');
                    userInfo.classList.add('hidden');
                    footerSaveInfo.textContent = "Seus dados são salvos localmente no seu navegador.";
                    loadProgress(); 
                }
            });

            loginBtn.addEventListener('click', () => {
                auth.signInWithPopup(googleProvider).catch(error => console.error("Erro no login:", error));
            });

            const displayUserInfo = (user) => {
                userInfo.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-semibold">${user.displayName}</span>
                        <img src="${user.photoURL}" alt="Foto do usuário" class="w-8 h-8 rounded-full">
                        <button id="logout-btn" class="text-sm text-red-600 hover:underline">Sair</button>
                    </div>
                `;
                document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());
            };

            // --- Data Logic ---
            const loadProgress = async () => {
                if (currentUser) {
                    const docRef = db.collection('userProgress').doc(currentUser.uid);
                    const doc = await docRef.get();
                    stagesData = (doc.exists) ? doc.data().stages : JSON.parse(JSON.stringify(initialStages));
                } else {
                    const localData = localStorage.getItem('cnhProgress');
                    stagesData = localData ? JSON.parse(localData) : JSON.parse(JSON.stringify(initialStages));
                }
                renderTimeline();
            };
            
            const migrateLocalDataToFirestore = async () => {
                const localDataRaw = localStorage.getItem('cnhProgress');
                if (localDataRaw && currentUser) {
                    const localData = JSON.parse(localDataRaw);
                    await db.collection('userProgress').doc(currentUser.uid).set({ stages: localData });
                    localStorage.removeItem('cnhProgress');
                }
            };

            const debouncedSave = () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(async () => {
                    if (currentUser) {
                        try {
                            await db.collection('userProgress').doc(currentUser.uid).set({ stages: stagesData });
                            showToast('Progresso salvo na nuvem!');
                        } catch (error) {
                            console.error("Erro ao salvar no Firestore: ", error);
                            showToast('Erro ao salvar. Tente novamente.');
                        }
                    } else {
                        localStorage.setItem('cnhProgress', JSON.stringify(stagesData));
                        showToast('Progresso salvo localmente!');
                    }
                }, 1500);
            };

            // --- UI & Rendering Logic ---
            const statusOptions = { default: [{ value: 'pendente', text: 'Pendente' }, { value: 'andamento', text: 'Em Andamento' },{ value: 'concluido', text: 'Concluído' }], exame: [{ value: 'pendente', text: 'Pendente' }, { value: 'aprovado', text: 'Aprovado' }, { value: 'reprovado', text: 'Reprovado' }], final: [{ value: 'pendente', text: 'Pendente' }, { value: 'emitido', text: 'Emitido' }] };
            const showToast = (message) => { toast.innerHTML = `<p>${message}</p>`; toast.classList.remove('translate-x-full'); toast.classList.add('translate-x-0'); setTimeout(() => { toast.classList.remove('translate-x-0'); toast.classList.add('translate-x-full'); }, 3000); };
            const updateCounters = () => {
                const dates = stagesData.map(stage => stage.date).filter(date => date);
                if (dates.length === 0) {
                    durationCounter.innerHTML = '<span>Insira uma data para começar a contagem!</span>';
                } else {
                    const firstDate = new Date(Math.min.apply(null, dates.map(dateStr => new Date(`${dateStr}T12:00:00Z`))));
                    const today = new Date(); today.setUTCHours(12,0,0,0);
                    if (firstDate > today) { durationCounter.innerHTML = '<span>Aguardando início...</span>'; }
                    else {
                        const diffTime = today - firstDate; const diffDays = Math.floor(diffTime / (1000*60*60*24));
                        let durationText = (diffDays < 1) ? "Hoje" : (diffDays === 1) ? "1 dia" : (diffDays < 30) ? `${diffDays} dias` : (() => {
                            const years = Math.floor(diffDays/365); const months = Math.floor((diffDays % 365) / 30.44);
                            let parts = [];
                            if (years > 0) parts.push(`${years} ${years === 1 ? 'ano':'anos'}`);
                            if (months > 0) parts.push(`${months} ${months === 1 ? 'mês':'meses'}`);
                            return parts.length > 0 ? parts.join(' e ') : `1 mês`;
                        })();
                        durationCounter.innerHTML = `<span>Tempo de processo: <strong>${durationText}</strong></span>`;
                    }
                }
                const totalCost = stagesData.reduce((total, stage) => total + (isNaN(parseFloat(stage.cost)) ? 0 : parseFloat(stage.cost)), 0);
                totalCostCounter.innerHTML = `<span>Custo Total: <strong>${totalCost.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></span>`;
            };

            const renderTimeline = () => {
                timelineContainer.innerHTML = '<div class="timeline-line hidden md:block"></div>';
                stagesData.forEach((stage, index) => {
                    const isEven = index % 2 === 0;
                    const timelineItem = document.createElement('div');
                    timelineItem.className = `timeline-item mb-8 flex w-full items-center md:justify-center`;
                    
                    if (stage.id === 'divulgacaoPasseDePrimeira') {
                        const adCardHTML = `<div class="bg-amber-50 rounded-lg shadow-xl p-4 md:p-6 border-2 border-amber-400"><h3 class="font-bold text-amber-800 text-xl mb-2">${stage.title}</h3><p class="text-gray-700 mb-4">${stage.notes}</p><a href="${stage.url}" target="_blank" class="block text-center w-full bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-600 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1">${stage.buttonText}</a></div>`;
                        timelineItem.innerHTML = `<div class="flex items-center w-full md:hidden"><div class="z-10 flex-shrink-0 flex items-center bg-amber-500 shadow-lg w-10 h-10 rounded-full"><svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg></div><div class="flex-1 ml-4">${adCardHTML}</div></div><div class="hidden md:flex w-full items-center justify-center"><div class="w-5/12 ${isEven ? '' : 'order-3'}">${isEven ? adCardHTML : ''}</div><div class="z-10 flex-shrink-0 flex items-center bg-amber-500 shadow-lg w-10 h-10 rounded-full mx-4 order-2"><svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg></div><div class="w-5/12 ${isEven ? 'order-3' : ''}">${!isEven ? adCardHTML : ''}</div></div>`;
                        timelineContainer.appendChild(timelineItem);
                        return;
                    }

                    const statusConfig = {pendente:{cardBg:'bg-gray-50',border:'border-gray-200',iconBg:'bg-gray-400'},andamento:{cardBg:'bg-blue-50',border:'border-blue-200',iconBg:'bg-logo-blue'},concluido:{cardBg:'bg-emerald-50',border:'border-emerald-200',iconBg:'bg-emerald-500'},aprovado:{cardBg:'bg-emerald-50',border:'border-emerald-200',iconBg:'bg-emerald-500'},reprovado:{cardBg:'bg-red-50',border:'border-red-200',iconBg:'bg-red-500'},emitido:{cardBg:'bg-emerald-50',border:'border-emerald-200',iconBg:'bg-emerald-500'}};
                    const currentStatus = statusConfig[stage.status] || statusConfig.pendente;
                    let currentStatusOptions = statusOptions.default;
                    if(stage.id.includes('exame')) currentStatusOptions = statusOptions.exame; else if(stage.id ==='permissao'||stage.id==='cnhDefinitiva') currentStatusOptions = statusOptions.final;
                    const optionsHtml = currentStatusOptions.map(opt => `<option value="${opt.value}" ${stage.status === opt.value ? 'selected' : ''}>${opt.text}</option>`).join('');
                    const cardContentHTML = `<h3 class="font-bold text-gray-800 text-lg mb-3">${stage.title}</h3><div class="space-y-4"><div class="grid grid-cols-2 gap-4"><div><label for="date-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Data</label><input type="date" id="date-${stage.id}" data-stage-id="${stage.id}" data-prop="date" value="${stage.date}" class="autosave w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue"></div><div><label for="cost-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Valor Gasto</label><input type="number" id="cost-${stage.id}" data-stage-id="${stage.id}" data-prop="cost" value="${stage.cost}" placeholder="R$ 0,00" class="autosave w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue"></div></div><div><label for="status-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Status</label><select id="status-${stage.id}" data-stage-id="${stage.id}" data-prop="status" class="autosave w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue">${optionsHtml}</select></div><div><label for="notes-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Anotações</label><textarea id="notes-${stage.id}" data-stage-id="${stage.id}" data-prop="notes" rows="2" class="autosave w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue" placeholder="Ex: Aprovado com 28/30 pontos...">${stage.notes}</textarea></div></div>`;
                    const cardWrapperHTML = `<div class="${currentStatus.cardBg} rounded-lg shadow-md p-4 md:p-6 border ${currentStatus.border}">${cardContentHTML}</div>`;
                    timelineItem.innerHTML = `<div class="flex items-center w-full md:hidden"><div class="z-10 flex-shrink-0 flex items-center ${currentStatus.iconBg} shadow-lg w-10 h-10 rounded-full"><svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg></div><div class="flex-1 ml-4">${cardWrapperHTML}</div></div><div class="hidden md:flex w-full items-center justify-center"><div class="w-5/12 ${isEven ? '' : 'order-3'}">${isEven ? cardWrapperHTML : ''}</div><div class="z-10 flex-shrink-0 flex items-center ${currentStatus.iconBg} shadow-lg w-10 h-10 rounded-full mx-4 order-2"><svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg></div><div class="w-5/12 ${isEven ? 'order-3' : ''}">${!isEven ? cardWrapperHTML : ''}</div></div>`;
                    timelineContainer.appendChild(timelineItem);
                });

                document.querySelectorAll('.autosave').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const stageId = e.target.dataset.stageId;
                        const prop = e.target.dataset.prop;
                        const stageIndex = stagesData.findIndex(s => s.id === stageId);
                        if (stageIndex !== -1) {
                            stagesData[stageIndex][prop] = e.target.value;
                            updateCounters();
                            if (prop === 'status') {
                                renderTimeline();
                            }
                            debouncedSave();
                        }
                    });
                });
                
                updateCounters();
            };

            shareBtn.addEventListener('click', async () => {
                const shareData = { title: 'MINHA CNH', text: 'Estou acompanhando meu processo para tirar a CNH com o app MINHA CNH! Acompanhe o seu também.', url: window.location.href };
                try {
                    if (navigator.share) await navigator.share(shareData);
                    else {
                        navigator.clipboard.writeText(shareData.url);
                        showToast('Link copiado para a área de transferência!');
                    }
                } catch (err) {
                    console.error("Erro ao compartilhar: ", err);
                    navigator.clipboard.writeText(shareData.url);
                    showToast('Link copiado para a área de transferência!');
                }
            });
            
            auth.onAuthStateChanged(user => {});
        });
    </script>

</body>
</html>
