<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINHA CNH - Acompanhamento do Processo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .text-logo-blue {
            color: #1E6A9C;
        }
        /* Vertical line for the timeline */
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 2rem;
            bottom: 2rem;
            width: 4px;
            background-color: #e5e7eb; /* gray-200 */
            transform: translateX(-50%);
        }
        /* Mobile timeline line */
        @media (max-width: 767px) {
            .timeline-line {
                left: 1.25rem; /* Corresponds to w-10 / 2 */
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body class="bg-white text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-12">
            <h1 class="text-5xl md:text-7xl font-black uppercase text-gray-800">
                MINHA <span class="text-logo-blue">CNH</span>
            </h1>
            <p class="text-gray-600 mt-3">Acompanhe seu processo para tirar a habilitação, etapa por etapa!</p>
        </header>

        <main id="timeline-container" class="relative">
            <div class="timeline-line hidden md:block"></div>
        </main>

        <footer class="text-center mt-12">
            <button id="clear-data-btn" class="bg-red-600 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:bg-red-700 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75">
                Limpar Todos os Dados
            </button>
            <p class="text-xs text-gray-400 mt-4">Todos os seus dados são salvos localmente no seu navegador.</p>
        </footer>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-500 text-white py-2 px-4 rounded-lg shadow-xl transition-transform transform translate-x-full duration-500">
        <p>Progresso salvo com sucesso!</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const timelineContainer = document.getElementById('timeline-container');
            const clearDataBtn = document.getElementById('clear-data-btn');
            const toast = document.getElementById('toast');

            const initialStages = [
                { id: 'requerimento', title: 'Formalização do Requerimento', status: 'pendente', date: '', notes: 'Início do processo no DETRAN ou canais digitais.', icon: 'M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9' },
                { id: 'cursoTeorico', title: 'Curso Teórico', status: 'pendente', date: '', notes: 'Aulas sobre legislação, direção defensiva, etc.', icon: 'M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25' },
                { id: 'biometria', title: 'Coleta Biométrica', status: 'pendente', date: '', notes: 'Coleta de foto, assinatura e digitais.', icon: 'M7.864 4.243A7.5 7.5 0 0119.5 10.5c0 2.92-.556 5.709-1.588 8.261a7.5 7.5 0 01-14.124 0c-1.032-2.552-1.588-5.34-1.588-8.261a7.5 7.5 0 013.75-6.486' },
                { id: 'examesMedicos', title: 'Exames de Aptidão Física e Mental', status: 'pendente', date: '', notes: 'Avaliação médica e psicológica.', icon: 'M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z' },
                { id: 'exameTeorico', title: 'Exame Teórico', status: 'pendente', date: '', notes: 'Prova oficial do DETRAN.', icon: 'M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
                { 
                    id: 'divulgacaoPasseDePrimeira', 
                    title: 'Dica de Ouro: Passe de Primeira!', 
                    notes: 'Aprovado na teoria? Turbine sua preparação para o exame prático! Nosso treinamento exclusivo "Passe de Primeira" tem tudo o que você precisa para conquistar sua CNH sem medo.', 
                    url: 'https://autoescolaaline.com.br/curso/',
                    buttonText: 'Conhecer o Treinamento',
                    icon: 'M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.311a12.061 12.061 0 01-4.5 0m3.75 2.311a12.061 12.061 0 01-4.5 0m5.625-10.44a6 6 0 11-11.25 0 6 6 0 0111.25 0z'
                },
                { id: 'aulasPraticas', title: 'Aulas Práticas de Direção', status: 'pendente', date: '', notes: 'Etapa opcional, mas recomendada. Defina a carga horária com seu instrutor.', icon: 'M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.472-.648a.75.75 0 01.819.162l3.908 3.908a.75.75 0 01-1.06 1.06l-3.908-3.908a8.973 8.973 0 01-4.286.974c-.487.023-.98.033-1.472.033a9.006 9.006 0 01-5.688-1.928A9 9 0 016 9a8.968 8.968 0 01.622-3.422A8.973 8.973 0 0112 3c1.242 0 2.417.316 3.472.867l-4.286 4.286a.75.75 0 01-1.06-1.06l3.908-3.908z' },
                { id: 'examePratico', title: 'Exame de Direção Veicular', status: 'pendente', date: '', notes: 'Prova prática de baliza e percurso.', icon: 'M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9.75m18 0v-6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 1.5v6m12 15a3 3 0 11-6 0 3 3 0 016 0z' },
                { id: 'permissao', title: 'Emissão da Permissão para Dirigir (PPD)', status: 'pendente', date: '', notes: 'Parabéns! Válida por 1 ano.', icon: 'M16.5 18a4.5 4.5 0 00-1.897 8.242l-2.276-2.275a2.25 2.25 0 01-.26-3.238l1.03-1.03a2.25 2.25 0 013.238.26l2.275 2.276A4.5 4.5 0 0016.5 18z' },
                { id: 'cnhDefinitiva', title: 'CNH Definitiva', status: 'pendente', date: '', notes: 'Conquista final após 1 ano sem infrações graves/gravíssimas.', icon: 'M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z' }
            ];

            const statusOptions = {
                default: [
                    { value: 'pendente', text: 'Pendente' },
                    { value: 'andamento', text: 'Em Andamento' },
                    { value: 'concluido', text: 'Concluído' },
                ],
                exame: [
                    { value: 'pendente', text: 'Pendente' },
                    { value: 'aprovado', text: 'Aprovado' },
                    { value: 'reprovado', text: 'Reprovado' },
                ],
                final: [
                    { value: 'pendente', text: 'Pendente' },
                    { value: 'emitido', text: 'Emitido' },
                ]
            };
            
            const loadProgress = () => {
                const savedData = localStorage.getItem('cnhProgress');
                return savedData ? JSON.parse(savedData) : JSON.parse(JSON.stringify(initialStages));
            };

            let stagesData = loadProgress();

            const saveProgress = () => {
                localStorage.setItem('cnhProgress', JSON.stringify(stagesData));
                showToast();
            };
            
            const showToast = () => {
                toast.classList.remove('translate-x-full');
                toast.classList.add('translate-x-0');
                setTimeout(() => {
                    toast.classList.remove('translate-x-0');
                    toast.classList.add('translate-x-full');
                }, 3000);
            };

            const renderTimeline = () => {
                timelineContainer.innerHTML = '<div class="timeline-line hidden md:block"></div>';

                stagesData.forEach((stage, index) => {
                    const isEven = index % 2 === 0;

                    const timelineItem = document.createElement('div');
                    timelineItem.className = `timeline-item mb-8 flex w-full items-center md:justify-center`;

                    if (stage.id === 'divulgacaoPasseDePrimeira') {
                        const adCardHTML = `
                            <div class="bg-amber-50 rounded-lg shadow-xl p-4 md:p-6 border-2 border-amber-400">
                                <h3 class="font-bold text-amber-800 text-xl mb-2">${stage.title}</h3>
                                <p class="text-gray-700 mb-4">${stage.notes}</p>
                                <a href="${stage.url}" target="_blank" class="block text-center w-full bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-emerald-600 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                                    ${stage.buttonText}
                                </a>
                            </div>`;
                        
                        timelineItem.innerHTML = `
                            <!-- Mobile -->
                            <div class="flex items-center w-full md:hidden">
                                <div class="z-10 flex-shrink-0 flex items-center bg-amber-500 shadow-lg w-10 h-10 rounded-full">
                                    <svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg>
                                </div>
                                <div class="flex-1 ml-4">${adCardHTML}</div>
                            </div>
                            <!-- Desktop -->
                            <div class="hidden md:flex w-full items-center justify-center">
                                <div class="w-5/12 ${isEven ? '' : 'order-3'}">${isEven ? adCardHTML : ''}</div>
                                <div class="z-10 flex-shrink-0 flex items-center bg-amber-500 shadow-lg w-10 h-10 rounded-full mx-4 order-2">
                                    <svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg>
                                </div>
                                <div class="w-5/12 ${isEven ? 'order-3' : ''}">${!isEven ? adCardHTML : ''}</div>
                            </div>
                        `;
                        timelineContainer.appendChild(timelineItem);
                        return;
                    }
                    
                    const statusConfig = {
                        pendente: { cardBg: 'bg-gray-50', border: 'border-gray-200', iconBg: 'bg-gray-400' },
                        andamento: { cardBg: 'bg-blue-50', border: 'border-blue-200', iconBg: 'bg-logo-blue' },
                        concluido: { cardBg: 'bg-emerald-50', border: 'border-emerald-200', iconBg: 'bg-emerald-500' },
                        aprovado: { cardBg: 'bg-emerald-50', border: 'border-emerald-200', iconBg: 'bg-emerald-500' },
                        reprovado: { cardBg: 'bg-red-50', border: 'border-red-200', iconBg: 'bg-red-500' },
                        emitido: { cardBg: 'bg-emerald-50', border: 'border-emerald-200', iconBg: 'bg-emerald-500' },
                    };
                    const currentStatus = statusConfig[stage.status] || statusConfig.pendente;

                    let optionsHtml;
                    let currentStatusOptions = statusOptions.default;
                    if (stage.id.includes('exame')) {
                        currentStatusOptions = statusOptions.exame;
                    } else if (stage.id === 'permissao' || stage.id === 'cnhDefinitiva') {
                        currentStatusOptions = statusOptions.final;
                    }
                    
                    optionsHtml = currentStatusOptions.map(opt => 
                        `<option value="${opt.value}" ${stage.status === opt.value ? 'selected' : ''}>${opt.text}</option>`
                    ).join('');

                    const cardContentHTML = `
                        <h3 class="font-bold text-gray-800 text-lg mb-3">${stage.title}</h3>
                        <div class="space-y-4">
                            <div>
                                <label for="date-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Data</label>
                                <input type="date" id="date-${stage.id}" value="${stage.date}" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue">
                            </div>
                            <div>
                                <label for="status-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Status</label>
                                <select id="status-${stage.id}" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue">
                                    ${optionsHtml}
                                </select>
                            </div>
                            <div>
                                <label for="notes-${stage.id}" class="block text-sm font-semibold text-gray-600 mb-1">Anotações</label>
                                <textarea id="notes-${stage.id}" rows="2" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-logo-blue focus:border-logo-blue" placeholder="Ex: Aprovado com 28/30 pontos...">${stage.notes}</textarea>
                            </div>
                            <button data-id="${stage.id}" class="save-btn w-full bg-emerald-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-emerald-600 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-opacity-75 shadow-md">Salvar Progresso</button>
                        </div>
                    `;

                    const cardWrapperHTML = `<div class="${currentStatus.cardBg} rounded-lg shadow-md p-4 md:p-6 border ${currentStatus.border}">${cardContentHTML}</div>`;
                    
                    timelineItem.innerHTML = `
                        <!-- Mobile -->
                        <div class="flex items-center w-full md:hidden">
                             <div class="z-10 flex-shrink-0 flex items-center ${currentStatus.iconBg} shadow-lg w-10 h-10 rounded-full">
                                <svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg>
                            </div>
                            <div class="flex-1 ml-4">${cardWrapperHTML}</div>
                        </div>
                        <!-- Desktop -->
                        <div class="hidden md:flex w-full items-center justify-center">
                            <div class="w-5/12 ${isEven ? '' : 'order-3'}">${isEven ? cardWrapperHTML : ''}</div>
                            <div class="z-10 flex-shrink-0 flex items-center ${currentStatus.iconBg} shadow-lg w-10 h-10 rounded-full mx-4 order-2">
                                <svg class="w-6 h-6 text-white mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${stage.icon}"></path></svg>
                            </div>
                             <div class="w-5/12 ${isEven ? 'order-3' : ''}">${!isEven ? cardWrapperHTML : ''}</div>
                        </div>
                    `;

                    timelineContainer.appendChild(timelineItem);
                });

                document.querySelectorAll('.save-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const stageId = e.target.getAttribute('data-id');
                        const stageIndex = stagesData.findIndex(s => s.id === stageId);
                        
                        if (stageIndex !== -1) {
                            stagesData[stageIndex].date = document.getElementById(`date-${stageId}`).value;
                            stagesData[stageIndex].status = document.getElementById(`status-${stageId}`).value;
                            stagesData[stageIndex].notes = document.getElementById(`notes-${stageId}`).value;
                            saveProgress();
                            renderTimeline();
                        }
                    });
                });
            };

            clearDataBtn.addEventListener('click', () => {
                if (confirm('Tem certeza que deseja apagar todo o seu progresso? Esta ação não pode ser desfeita.')) {
                    localStorage.removeItem('cnhProgress');
                    stagesData = JSON.parse(JSON.stringify(initialStages));
                    renderTimeline();
                }
            });

            renderTimeline();
        });
    </script>

</body>
</html>
